<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#12213d}.h{font-size:44px;font-weight:700}.sh{font-size:28px;font-weight:700}.b{font-size:20px}.sm{font-size:18px}.card{stroke:#d8e1ee;stroke-width:2}.a{stroke:#64748b;stroke-width:7;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs>
<rect width="1400" height="1000" fill="#fff"/><text x="700" y="58" class="t h" text-anchor="middle">How changes are evaluated</text>
<rect x="280" y="95" rx="24" width="840" height="110" fill="#f3efff" class="card"/><text x="340" y="140" class="t sh">1. Code change</text><text x="340" y="175" class="t b">Change search logic, prompts or workflow.</text><path d="M700 205V245" class="a"/>
<rect x="150" y="260" rx="24" width="900" height="300" fill="#eaf4ff" class="card"/><text x="190" y="305" class="t sh">2. Test on development set</text><text x="190" y="342" class="t sh" fill="#1264a3">20 topics originally → 18 active + 2 retired</text>
<text x="190" y="395" class="t b">• Each active topic is run 3 times</text><text x="190" y="430" class="t b">• Each topic has a gold-standard set of relevant records</text><text x="190" y="465" class="t b">• The agent does not see the gold-standard records</text>
<rect x="690" y="330" rx="12" width="100" height="48" fill="#cfe7ff"/><text x="740" y="361" class="t b" text-anchor="middle">Run 1</text><rect x="690" y="390" rx="12" width="100" height="48" fill="#cfe7ff"/><text x="740" y="421" class="t b" text-anchor="middle">Run 2</text><rect x="690" y="450" rx="12" width="100" height="48" fill="#cfe7ff"/><text x="740" y="481" class="t b" text-anchor="middle">Run 3</text>
<text x="820" y="350" class="t sh">Evaluate</text><text x="820" y="390" class="t b">• Recall</text><text x="820" y="425" class="t b">• Unseen recall</text><text x="820" y="460" class="t b">• Result count</text><text x="820" y="495" class="t b">• Workload</text><text x="820" y="530" class="t b">• Run-to-run variation</text>
<rect x="1090" y="275" rx="20" width="270" height="255" fill="#f3f6f9" class="card"/><text x="1225" y="320" class="t sh" text-anchor="middle">Gold standard hidden</text><text x="1120" y="370" class="t b">The agent can use:</text><text x="1120" y="405" class="t b">• review topic</text><text x="1120" y="440" class="t b">• permitted seed papers</text><text x="1120" y="485" class="t b">It cannot see the complete</text><text x="1120" y="515" class="t b">set used for scoring.</text>
<path d="M600 560V610" class="a"/><polygon points="600,610 700,670 600,730 500,670" fill="#fff2c8" stroke="#e6b93c" stroke-width="3"/><text x="600" y="660" class="t sh" text-anchor="middle">Does it</text><text x="600" y="692" class="t sh" text-anchor="middle">improve?</text>
<text x="730" y="660" class="t b" fill="#198754">Yes</text><text x="450" y="660" class="t b" fill="#c43b3b">No</text><rect x="120" y="625" rx="18" width="250" height="90" fill="#ffe1e1" class="card"/><text x="245" y="665" class="t sh" text-anchor="middle">Revise change</text><text x="245" y="695" class="t sm" text-anchor="middle">then test again</text><path d="M500 670H380" class="a"/><path d="M245 625V575H150V410" class="a"/>
<path d="M600 730V770" class="a"/><rect x="250" y="780" rx="24" width="900" height="160" fill="#edf9ef" class="card"/><text x="290" y="825" class="t sh">3. Test on held-out set — 10 topics</text><text x="290" y="865" class="t b">• Topics are frozen before evaluation and never used to tune the change</text><text x="290" y="900" class="t b">• Run the same performance checks on topics the change has not seen</text><text x="290" y="930" class="t b">• If performance generalises, the change can be accepted</text>
</svg>