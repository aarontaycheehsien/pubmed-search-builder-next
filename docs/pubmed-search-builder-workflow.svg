<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="946" viewBox="0 0 1420 946" role="img" aria-labelledby="title desc">
<title id="title">PubMed Search Builder workflow with a distinct allocation step</title>
<desc id="desc">The seven-stage workflow shows eight cards because Step 3 has two explicit substeps: 3a Discover and screen known records, followed by 3b Allocate eligible records between development and held-out testing. The arrows flow across the upper row, down, and back along the lower row to final delivery.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a708f"/></marker>
<marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#16815b"/></marker>
</defs>
<style>.title{font:700 39px Arial,sans-serif;fill:#15354c}.subtitle{font:19px Arial,sans-serif;fill:#4a667b}.number{font:700 21px Arial,sans-serif;fill:white}.heading{font:700 25px Arial,sans-serif;fill:#17374b}.smallcap{font:700 13px Arial,sans-serif;letter-spacing:.8px}.body{font:18px Arial,sans-serif;fill:#3f6073}.footer{font:19px Arial,sans-serif;fill:#21485c}.footnote{font:16px Arial,sans-serif;fill:#526b7c}</style>
<rect width="1420" height="946" fill="white"/>
<text class="title" x="32" y="61">PubMed Search Builder: from question to tested search</text>
<text class="subtitle" x="32" y="104">Seven stages, with discovery/screening and allocation shown separately within Step 3</text>
<g>
<rect x="32" y="163" width="310" height="232" rx="20" fill="#eff5fa" stroke="#ccdae5" stroke-width="1.5"/>
<circle cx="70" cy="201" r="23" fill="#206d91"/>
<text class="number" x="70" y="209" text-anchor="middle">1</text>
<text class="heading" x="54" y="257">Intake</text>
<text class="smallcap" x="54" y="286" fill="#206d91">QUESTION AND LIMITS</text>
<text class="body" x="54" y="331">Ask for the review question,</text>
<text class="body" x="54" y="359">depth, limits and optional papers</text>
</g>
<g>
<rect x="379" y="163" width="310" height="232" rx="20" fill="#eff5fa" stroke="#ccdae5" stroke-width="1.5"/>
<circle cx="417" cy="201" r="23" fill="#206d91"/>
<text class="number" x="417" y="209" text-anchor="middle">2</text>
<text class="heading" x="401" y="257">Scope</text>
<text class="smallcap" x="401" y="286" fill="#206d91">USER CONFIRMS</text>
<text class="body" x="401" y="331">Choose searched, screened</text>
<text class="body" x="401" y="359">and optional concepts</text>
</g>
<g>
<rect x="726" y="163" width="310" height="232" rx="20" fill="#eff5fa" stroke="#ccdae5" stroke-width="1.5"/>
<circle cx="764" cy="201" r="25" fill="#206d91"/>
<text class="number" x="764" y="209" text-anchor="middle">3a</text>
<text class="heading" x="748" y="257">Known records</text>
<text class="smallcap" x="748" y="286" fill="#206d91">DISCOVER AND SCREEN</text>
<text class="body" x="748" y="331">Find candidates and assess</text>
<text class="body" x="748" y="359">eligibility against the scope</text>
</g>
<g>
<rect x="1073" y="163" width="310" height="232" rx="20" fill="#e7f5ec" stroke="#16815b" stroke-width="2.5"/>
<circle cx="1111" cy="201" r="25" fill="#16815b"/>
<text class="number" x="1111" y="209" text-anchor="middle">3b</text>
<text class="heading" x="1095" y="257">Allocation</text>
<text class="smallcap" x="1095" y="286" fill="#16815b">USER CHOOSES IF OFFERED</text>
<text class="body" x="1095" y="331">Assign eligible studies to</text>
<text class="body" x="1095" y="359">development or held-out test</text>
</g>
<g>
<rect x="1073" y="506" width="310" height="232" rx="20" fill="#eff5fa" stroke="#ccdae5" stroke-width="1.5"/>
<circle cx="1111" cy="544" r="23" fill="#206d91"/>
<text class="number" x="1111" y="552" text-anchor="middle">4</text>
<text class="heading" x="1095" y="600">Vocabulary</text>
<text class="smallcap" x="1095" y="629" fill="#206d91">VERIFY TERMS</text>
<text class="body" x="1095" y="674">MeSH headings and</text>
<text class="body" x="1095" y="702">title/abstract vocabulary</text>
</g>
<g>
<rect x="726" y="506" width="310" height="232" rx="20" fill="#eff5fa" stroke="#ccdae5" stroke-width="1.5"/>
<circle cx="764" cy="544" r="23" fill="#206d91"/>
<text class="number" x="764" y="552" text-anchor="middle">5</text>
<text class="heading" x="748" y="600">Develop &amp; revise</text>
<text class="smallcap" x="748" y="629" fill="#206d91">EMPIRICAL TESTING</text>
<text class="body" x="748" y="674">Run searches; check known</text>
<text class="body" x="748" y="702">records and diagnose misses</text>
</g>
<g>
<rect x="379" y="506" width="310" height="232" rx="20" fill="#eff5fa" stroke="#ccdae5" stroke-width="1.5"/>
<circle cx="417" cy="544" r="23" fill="#206d91"/>
<text class="number" x="417" y="552" text-anchor="middle">6</text>
<text class="heading" x="401" y="600">Critique</text>
<text class="smallcap" x="401" y="629" fill="#206d91">INTERNAL PRESS REVIEW</text>
<text class="body" x="401" y="674">Review strategy in a fresh</text>
<text class="body" x="401" y="702">context; address findings</text>
</g>
<g>
<rect x="32" y="506" width="310" height="232" rx="20" fill="#eff5fa" stroke="#ccdae5" stroke-width="1.5"/>
<circle cx="70" cy="544" r="23" fill="#206d91"/>
<text class="number" x="70" y="552" text-anchor="middle">7</text>
<text class="heading" x="54" y="600">Deliver</text>
<text class="smallcap" x="54" y="629" fill="#206d91">TEST AND VALIDATE</text>
<text class="body" x="54" y="674">Held-out test once if reserved;</text>
<text class="body" x="54" y="702">live validation, query + audit</text>
</g>
<path d="M 342 278 L 375 278" fill="none" stroke="#2a708f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 689 278 L 722 278" fill="none" stroke="#2a708f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1036 278 L 1069 278" fill="none" stroke="#2a708f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1228 395 L 1228 502" fill="none" stroke="#16815b" stroke-width="4" marker-end="url(#arrow-green)"/>
<path d="M 1073 621 L 1040 621" fill="none" stroke="#2a708f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 726 621 L 693 621" fill="none" stroke="#2a708f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 379 621 L 346 621" fill="none" stroke="#2a708f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="32" y="765" width="1351" height="132" rx="17" fill="#edf4f7"/>
<text x="58" y="806" class="footer" font-weight="bold">Development loop: construct → execute → measure → diagnose → revise</text>
<text x="58" y="845" class="footer">Held-out records remain unseen during development and are tested once, when a holdout exists.</text>
<text x="58" y="877" class="footnote">Final draft: PubMed strategy • line-by-line counts • known-record checks • internal critique • audit</text>
</svg>