<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">Seven-stage PubMed Search Builder workflow</title>
<desc id="desc">Intake, user-approved scope, known record screening and allocation, vocabulary, iterative PubMed testing, internal critique, and final held-out test and delivery.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#176e91"/></marker></defs>
<style>.title{font:700 39px Arial,sans-serif;fill:#143047}.sub{font:19px Arial,sans-serif;fill:#4c6577}.number{font:700 21px Arial,sans-serif;fill:white}.heading{font:700 25px Arial,sans-serif;fill:#143047}.smallcap{font:700 12px Arial,sans-serif;letter-spacing:1px;fill:#176e91}.body{font:16px Arial,sans-serif;fill:#456071}.foot{font:18px Arial,sans-serif;fill:#143047}</style>
<rect width="1600" height="640" fill="white"/>
<text class="title" x="28" y="66">PubMed Search Builder: from question to tested search</text>
<text class="sub" x="28" y="106">Seven stages • live PubMed queries • human decisions at scope and allocation</text>
<g>
<rect x="28" y="150" width="202" height="250" rx="20" fill="#eef6fb" stroke="#ccd9e5" stroke-width="1.5"/>
<circle cx="63" cy="185" r="20" fill="#176e91"/><text x="63" y="192" class="number" text-anchor="middle">1</text>
<text x="47" y="247" class="heading">Intake</text>
<text x="47" y="276" class="smallcap">QUESTION + LIMITS</text>
<text x="47" y="319" class="body">Review question, criteria,</text><text x="47" y="344" class="body">known papers, depth</text>
</g>
<g>
<rect x="247" y="150" width="202" height="250" rx="20" fill="#f4f7fb" stroke="#ccd9e5" stroke-width="1.5"/>
<circle cx="282" cy="185" r="20" fill="#176e91"/><text x="282" y="192" class="number" text-anchor="middle">2</text>
<text x="266" y="247" class="heading">Scope</text>
<text x="266" y="276" class="smallcap">USER APPROVAL</text>
<text x="266" y="319" class="body">Search vs screening</text><text x="266" y="344" class="body">concepts; confirm roles</text>
</g>
<g>
<rect x="466" y="150" width="202" height="250" rx="20" fill="#eef6fb" stroke="#ccd9e5" stroke-width="1.5"/>
<circle cx="501" cy="185" r="20" fill="#176e91"/><text x="501" y="192" class="number" text-anchor="middle">3</text>
<text x="485" y="247" class="heading">Known records</text>
<text x="485" y="276" class="smallcap">SCREEN + ALLOCATE</text>
<text x="485" y="319" class="body">Find eligible studies;</text><text x="485" y="344" class="body">choose holdout if feasible</text>
</g>
<g>
<rect x="685" y="150" width="202" height="250" rx="20" fill="#f4f7fb" stroke="#ccd9e5" stroke-width="1.5"/>
<circle cx="720" cy="185" r="20" fill="#176e91"/><text x="720" y="192" class="number" text-anchor="middle">4</text>
<text x="704" y="247" class="heading">Vocabulary</text>
<text x="704" y="276" class="smallcap">VERIFIED TERMS</text>
<text x="704" y="319" class="body">Check MeSH headings</text><text x="704" y="344" class="body">and title/abstract terms</text>
</g>
<g>
<rect x="904" y="150" width="202" height="250" rx="20" fill="#eef6fb" stroke="#ccd9e5" stroke-width="1.5"/>
<circle cx="939" cy="185" r="20" fill="#176e91"/><text x="939" y="192" class="number" text-anchor="middle">5</text>
<text x="923" y="247" class="heading">Develop</text>
<text x="923" y="276" class="smallcap">TEST + REVISE</text>
<text x="923" y="319" class="body">Run PubMed; diagnose</text><text x="923" y="344" class="body">misses and revise</text>
</g>
<g>
<rect x="1123" y="150" width="202" height="250" rx="20" fill="#f4f7fb" stroke="#ccd9e5" stroke-width="1.5"/>
<circle cx="1158" cy="185" r="20" fill="#176e91"/><text x="1158" y="192" class="number" text-anchor="middle">6</text>
<text x="1142" y="247" class="heading">Critique</text>
<text x="1142" y="276" class="smallcap">INTERNAL REVIEW</text>
<text x="1142" y="319" class="body">PRESS-structured</text><text x="1142" y="344" class="body">critique and responses</text>
</g>
<g>
<rect x="1342" y="150" width="202" height="250" rx="20" fill="#eef6fb" stroke="#ccd9e5" stroke-width="1.5"/>
<circle cx="1377" cy="185" r="20" fill="#176e91"/><text x="1377" y="192" class="number" text-anchor="middle">7</text>
<text x="1361" y="247" class="heading">Deliver</text>
<text x="1361" y="276" class="smallcap">TEST + VALIDATE</text>
<text x="1361" y="319" class="body">One held-out test if</text><text x="1361" y="344" class="body">reserved; audit + query</text>
</g>
<path d="M 230 270 H 243" stroke="#176e91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 449 270 H 462" stroke="#176e91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 668 270 H 681" stroke="#176e91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 887 270 H 900" stroke="#176e91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1106 270 H 1119" stroke="#176e91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1325 270 H 1338" stroke="#176e91" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="28" y="444" width="1540" height="122" rx="18" fill="#edf4f7"/>
<text x="54" y="482" class="foot" font-weight="bold">Development loop: construct → execute → measure → diagnose → revise</text>
<text x="54" y="516" class="foot">Held-out records remain unseen during development; a frozen strategy is tested once, when a holdout exists.</text>
<text x="54" y="545" class="sub">Final output: executable PubMed strategy • line counts • retrieval checks • PRESS-structured internal critique • audit</text>
</svg>