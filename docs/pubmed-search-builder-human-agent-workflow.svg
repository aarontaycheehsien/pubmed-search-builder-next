<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="690" viewBox="0 0 1360 690" role="img" aria-labelledby="title desc">
<title id="title">Human and agent responsibilities during PubMed Search Builder</title>
<desc id="desc">The user provides a question, approves search concept roles and decides on an optional holdout. The agent finds records, builds and tests strategies, then delivers an audited draft for human peer review.</desc>
<style>.title{font:700 38px Arial,sans-serif;fill:#143047}.heading{font:700 23px Arial,sans-serif;fill:#163d55}.text{font:18px Arial,sans-serif;fill:#37576a}.tag{font:700 14px Arial,sans-serif;fill:#176e91;letter-spacing:1px}.note{font:17px Arial,sans-serif;fill:#36596d}</style>
<rect width="1360" height="690" fill="#fff"/>
<text x="48" y="67" class="title">How you and the agent work together</text>
<rect x="48" y="104" width="588" height="486" rx="20" fill="#edf7fb" stroke="#cddce8"/>
<rect x="723" y="104" width="588" height="486" rx="20" fill="#f4f6fa" stroke="#d5dfeb"/>
<text x="79" y="144" class="tag">YOUR DECISIONS</text>
<text x="754" y="144" class="tag">WHAT THE AGENT DOES</text>
<text x="79" y="200" class="heading">1. Provide the review question</text>
<text x="79" y="228" class="text">Criteria, limits and known papers are optional; agent asks.</text>
<text x="79" y="304" class="heading">2. Approve the scope</text>
<text x="79" y="332" class="text">Check searched, screened and optional concepts.</text>
<text x="79" y="408" class="heading">3. Decide on the holdout</text>
<text x="79" y="436" class="text">When offered, keep an unseen test set or use all</text>
<text x="79" y="462" class="text">records for search development.</text>
<text x="79" y="536" class="heading">4. Review delivery and repair</text>
<text x="79" y="562" class="text">If misses occur, choose Repair; seek human PRESS review.</text>
<text x="754" y="200" class="heading">Discover and screen eligible records</text>
<text x="754" y="228" class="text">Use separate screening where available.</text>
<text x="754" y="304" class="heading">Build and test the strategy</text>
<text x="754" y="332" class="text">Verify MeSH, run PubMed, diagnose misses, revise.</text>
<text x="754" y="408" class="heading">Perform an internal critique</text>
<text x="754" y="436" class="text">Resolve findings before final delivery.</text>
<text x="754" y="536" class="heading">Test and deliver</text>
<text x="754" y="562" class="text">Test held-out records if reserved; audit and offer Repair.</text>
<path d="M636 329 H716" stroke="#176e91" stroke-width="4"/>
<path d="M703 320 L717 329 L703 338" fill="none" stroke="#176e91" stroke-width="4"/>
<rect x="48" y="612" width="1263" height="48" rx="11" fill="#edf4f7"/>
<text x="72" y="641" class="note">Hidden-from-builder records are not necessarily representative; the tool does not guarantee complete recall.</text>
</svg>